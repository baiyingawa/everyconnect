name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EveryConnect / DSH 版本
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 请删除 token、二维码 URL、context token 和个人信息。
